<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdaPlant AI - Akıllı Bitki Asistanı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 40%, #52b788 100%);
            min-height: 100vh;
            color: #2d3748;
            display: flex;
            flex-direction: column;
        }

        /* Z-Pattern 1: Sol Üst Logo ve Başlık */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2.5rem;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo img {
            height: 46px;
            width: auto;
            object-fit: contain;
        }

        .brand-logo h1 {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Z-Pattern Akış Kapsayıcısı */
        .main-wrapper {
            max-width: 900px;
            width: 92%;
            margin: 1rem auto 3rem auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Z-Pattern 2: Glassmorphism AI Sohbet Kartı */
        .glass-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            color: #ffffff;
        }

        .glass-card h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }

        #yanit-alani {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 1.2rem;
            height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 1rem;
        }

        .chat-bubble {
            padding: 0.8rem 1.1rem;
            border-radius: 14px;
            max-width: 82%;
            line-height: 1.45;
            font-size: 0.95rem;
        }

        .chat-bubble.ai {
            background: rgba(255, 255, 255, 0.92);
            color: #1b4332;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-bubble.user {
            background: #1b4332;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chat-input-row {
            display: flex;
            gap: 0.8rem;
        }

        #mesaj-girisi {
            flex: 1;
            padding: 0.85rem 1.2rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.95);
            font-size: 0.95rem;
            color: #1a202c;
            outline: none;
        }

        #btn-sor {
            background: #1b4332;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0 1.8rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s ease;
        }

        #btn-sor:hover {
            background: #081c15;
        }

        /* Z-Pattern 3: Gözün İndiği Alt Bölge Form Kartı */
        .form-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .form-card h2 {
            color: #1b4332;
            margin-bottom: 0.4rem;
        }

        .form-card p {
            color: #718096;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin-bottom: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
        }

        input {
            padding: 0.85rem 1rem;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: #2d6a4f;
        }

        #btn-kaydet {
            width: 100%;
            background: #2d6a4f;
            color: #ffffff;
            border: none;
            padding: 0.95rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        #btn-kaydet:hover {
            background: #1b4332;
        }

        #bildirim-alani {
            padding: 0.85rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .alert-success {
            background: #d8f3dc;
            color: #1b4332;
        }

        .alert-error {
            background: #fde8e8;
            color: #9b1c1c;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full {
                grid-column: span 1;
            }
            header {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Z-PATTERN 1: Sol Üst Logo & Başlık -->
    <header>
        <a href="/" class="brand-logo" id="logo-alani">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="AdaPlant Logo">
            <h1 id="marka-baslik">AdaPlant AI</h1>
        </a>
        <a href="/dashboard" class="nav-btn" id="link-dashboard">Yönetim Paneli &rarr;</a>
    </header>

    <div class="main-wrapper">
        
        <!-- Z-PATTERN 2: Glassmorphism AI Sohbet Kartı -->
        <section class="glass-card" id="sohbet-karti">
            <h2>Akıllı Bitki Asistanı</h2>
            
            <!-- Yanıt Alanı -->
            <div id="yanit-alani">
                <div class="chat-bubble ai">
                    Merhaba! Ben AdaPlant asistanıyım. Bitki bakımı, tür önerileri veya sipariş danışmanlığı için dilediğinizi sorabilirsiniz.
                </div>
            </div>

            <!-- Mesaj Girişi & Sor Butonu -->
            <div class="chat-input-row">
                <input type="text" id="mesaj-girisi" placeholder="Sorunuzu buraya yazın... (örn: Az su isteyen salon bitkileri)">
                <button type="button" id="btn-sor" onclick="soruGonder()">Sor</button>
            </div>
        </section>

        <!-- Z-PATTERN 3: Gözün İndiği Alt Bölge Form & Kaydet Butonu -->
        <section class="form-card" id="lead-karti">
            <h2>İletişim & Danışmanlık Formu</h2>
            <p>Bitki uzmanlarımızın sizinle iletişime geçmesi için bilgilerinizi bırakabilirsiniz.</p>

            <form id="lead-formu" onsubmit="leadKaydet(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="isim-girisi">Adınız Soyadınız *</label>
                        <input type="text" id="isim-girisi" required placeholder="Örn: Ayşe Demir">
                    </div>
                    <div class="form-group">
                        <label for="telefon-girisi">Telefon Numaranız *</label>
                        <input type="tel" id="telefon-girisi" required placeholder="Örn: 0532 000 00 00">
                    </div>
                    <div class="form-group full">
                        <label for="talep-girisi">İlginizi Çeken Bitki veya Konu (İsteğe Bağlı)</label>
                        <input type="text" id="talep-girisi" placeholder="Örn: Monstera bakımı ve saksı değişimi">
                    </div>
                </div>
                
                <button type="submit" id="btn-kaydet">Kaydet</button>
            </form>

            <div id="bildirim-alani"></div>
        </section>

    </div>

    <script>
        const chatGecmisi = [];

        document.getElementById('mesaj-girisi').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                soruGonder();
            }
        });

        async function soruGonder() {
            const input = document.getElementById('mesaj-girisi');
            const btn = document.getElementById('btn-sor');
            const yanitAlani = document.getElementById('yanit-alani');
            const metin = input.value.trim();

            if (!metin) return;

            yanitAlani.innerHTML += `<div class="chat-bubble user">${metin}</div>`;
            input.value = '';
            btn.disabled = true;
            btn.innerText = 'Düşünüyor...';
            yanitAlani.scrollTop = yanitAlani.scrollHeight;

            try {
                const response = await fetch('/api/sohbet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mesaj: metin, gecmis: chatGecmisi })
                });
                const data = await response.json();

                if (data.basari) {
                    yanitAlani.innerHTML += `<div class="chat-bubble ai">${data.cevap}</div>`;
                    chatGecmisi.push({ role: 'user', content: metin });
                    chatGecmisi.push({ role: 'assistant', content: data.cevap });
                } else {
                    yanitAlani.innerHTML += `<div class="chat-bubble ai" style="color:red;">Hata: ${data.hata}</div>`;
                }
            } catch (err) {
                yanitAlani.innerHTML += `<div class="chat-bubble ai" style="color:red;">Sunucuya ulaşılamadı.</div>`;
            }

            btn.disabled = false;
            btn.innerText = 'Sor';
            yanitAlani.scrollTop = yanitAlani.scrollHeight;
        }

        async function leadKaydet(e) {
            e.preventDefault();
            const alertDiv = document.getElementById('bildirim-alani');
            const isim = document.getElementById('isim-girisi').value.trim();
            const telefon = document.getElementById('telefon-girisi').value.trim();
            const mesaj = document.getElementById('talep-girisi').value.trim();
            const btn = document.getElementById('btn-kaydet');

            btn.disabled = true;
            btn.innerText = 'Kaydediliyor...';
            alertDiv.style.display = 'none';

            try {
                const res = await fetch('/api/leads', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isim, telefon, mesaj })
                });
                const data = await res.json();

                if (data.basari) {
                    alertDiv.className = 'alert-success';
                    alertDiv.innerText = 'Bilgileriniz başarıyla kaydedildi! En kısa sürede size ulaşacağız.';
                    alertDiv.style.display = 'block';
                    document.getElementById('lead-formu').reset();
                } else {
                    alertDiv.className = 'alert-error';
                    alertDiv.innerText = data.hata || 'Kayıt sırasında bir hata oluştu.';
                    alertDiv.style.display = 'block';
                }
            } catch (err) {
                alertDiv.className = 'alert-error';
                alertDiv.innerText = 'Bağlantı hatası oluştu.';
                alertDiv.style.display = 'block';
            }

            btn.disabled = false;
            btn.innerText = 'Kaydet';
        }
    </script>
</body>
</html>
